# llama-swap (MIT, upstream, unmodified) for sm3lly: one RTX 3090, one model resident at a time. It starts and stops the model containers.
# Every container carries a memory cap (sm3lly's OCI hook rejects uncapped ones; no bypass annotation is used here).
# Model names are the ones clients already use (kr0ki asks for neo-coder), so no client changes.
healthCheckTimeout: 600
logLevel: info
models:
  neo-coder:
    proxy: http://127.0.0.1:${PORT}
    cmd: >
      podman run --rm --name swap-neo-coder --device nvidia.com/gpu=0 --memory=14g --memory-swap=14g
      -v /home/brianh/.cache/huggingface/hub/models--DavidAU--Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF:/models:ro
      -p 127.0.0.1:${PORT}:8080 ghcr.io/ggml-org/llama.cpp:server-cuda --host 0.0.0.0 --port 8080
      -m /models/snapshots/0b4bc07a8c549be631ed8f5fd78b68fb0e80eced/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-MTP-IQ4_NL.gguf --alias neo-coder
      -c 131072 -b 4096 -ub 1024 -ngl 99 -fa on --cache-type-k q4_0 --cache-type-v q4_0 -np 1 --jinja --reasoning off
      --temp 0.6 --top-p 0.95 --top-k 20 --repeat-penalty 1.0
      --mmproj /models/snapshots/0b4bc07a8c549be631ed8f5fd78b68fb0e80eced/mmproj-F16.gguf
    cmdStop: podman stop -t 30 swap-neo-coder
  arete-27b:
    proxy: http://127.0.0.1:${PORT}
    cmd: >
      podman run --rm --name swap-arete --device nvidia.com/gpu=0 --memory=8g --memory-swap=8g
      -v /c0de/models/arete-27b:/models:ro
      -p 127.0.0.1:${PORT}:8080 ghcr.io/ggml-org/llama.cpp:server-cuda --host 0.0.0.0 --port 8080
      -m /models/Arete-27B-AD-Q5_K_M.gguf --alias arete-27b
      -c 16384 -b 2048 -ub 512 -ngl 99 -fa on --cache-type-k q8_0 --cache-type-v q8_0 -np 1 --jinja
      --temp 0 --mmproj /models/mmproj-Arete-27B-F16.gguf
    cmdStop: podman stop -t 30 swap-arete
