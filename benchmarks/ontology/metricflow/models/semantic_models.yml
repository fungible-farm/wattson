semantic_models:
  - name: interconnector_dim
    model: ref('dim_interconnector')
    description: key table of distinct interconnector ids
    entities:
      - name: interconnector
        type: primary
        expr: INTERCONNECTORID
    dimensions:
      - name: interconnectorid
        type: categorical
        expr: INTERCONNECTORID
  - name: station_dim
    model: ref('dim_station')
    description: key table of distinct station ids
    entities:
      - name: station
        type: primary
        expr: STATIONID
    dimensions:
      - name: stationid
        type: categorical
        expr: STATIONID
        description: "power station id"
  - name: region_dim
    model: ref('dim_region')
    description: key table of distinct region ids
    entities:
      - name: region
        type: primary
        expr: REGIONID
    dimensions:
      - name: regionid
        type: categorical
        expr: REGIONID
        description: "NEM region id: NSW1, QLD1, SA1, TAS1, VIC1"
  - name: dispatchload
    model: ref('dispatchload')
    description: AEMO DISPATCHLOAD table (NEMOSIS), 2025-09-01; intervention 0 only.
    primary_entity: dispatchload_record
    defaults:
      agg_time_dimension: settlementdate
    entities:
      - name: duid
        type: foreign
        expr: DUID
    dimensions:
      - name: settlementdate
        type: time
        description: "END of the 5-minute dispatch interval"
        type_params:
          time_granularity: minute
      - name: intervention
        type: categorical
        expr: INTERVENTION
        description: "0 = normal dispatch run (the only one loaded)"
      - name: dispatchmode
        type: categorical
        expr: DISPATCHMODE
      - name: agcstatus
        type: categorical
        expr: AGCSTATUS
      - name: semidispatchcap
        type: categorical
        expr: SEMIDISPATCHCAP
    measures:
      - name: dispatchload_row_count
        agg: sum
        expr: 1
        description: "number of dispatchload rows"
      - name: dispatchload_duid_distinct_count
        agg: count_distinct
        expr: DUID
        description: "distinct duid values"
      - name: dispatchload_interval_distinct_count
        agg: count_distinct
        expr: SETTLEMENTDATE
        description: "distinct 5-minute intervals"
      - name: dispatchload_cleared_energy_mwh
        agg: sum
        expr: TOTALCLEARED * 5.0 / 60.0
        description: "net energy MWh = MW * 5/60, negatives included"
      - name: dispatchload_totalcleared_total
        agg: sum
        expr: TOTALCLEARED
        description: "total of TOTALCLEARED (dispatched MW, negative when charging/consuming)"
      - name: dispatchload_totalcleared_avg
        agg: average
        expr: TOTALCLEARED
        description: "avg of TOTALCLEARED (dispatched MW, negative when charging/consuming)"
      - name: dispatchload_totalcleared_max
        agg: max
        expr: TOTALCLEARED
        description: "max of TOTALCLEARED (dispatched MW, negative when charging/consuming)"
      - name: dispatchload_totalcleared_min
        agg: min
        expr: TOTALCLEARED
        description: "min of TOTALCLEARED (dispatched MW, negative when charging/consuming)"
      - name: dispatchload_initialmw_total
        agg: sum
        expr: INITIALMW
        description: "total of INITIALMW (initial MW)"
      - name: dispatchload_initialmw_avg
        agg: average
        expr: INITIALMW
