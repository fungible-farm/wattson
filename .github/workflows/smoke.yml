name: smoke
# The v0.1.0 smoke check on a machine that is neither the author's DGX nor the 3090 host: GitHub's x86_64 runner.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: scripts/smoke.sh
