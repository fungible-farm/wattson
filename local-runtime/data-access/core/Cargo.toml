[package]
name = "wattson-sheet"
version = "0.1.0"
edition = "2024"
publish = false
description = "Read-only Excel extraction and parameter validation for Wattson's data pilot"
license = "MIT"

[workspace]

[dependencies]
# MIT; no Excel installation, COM, LibreOffice, or macro execution.
calamine = "=0.36.1"
# All MIT/Apache-2.0 except sha2 (MIT/Apache-2.0); versions resolved in Cargo.lock.
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
regex = "1"
sha2 = "0.10"
