# Granite 4.2 8B tool-call student (AGENTS.md FM-19 retrain). Hyperparameters are
# identical to config.qwen35-4b.yaml; only the model block differs.
model:
  # Apache-2.0 (IBM model card); the pinned r4 download, verified by its hub metadata.
  name: training/unsloth/out/granite-4.2-8b-base
  source_hf_id: ibm-granite/granite-4.2-8b
  source_revision: b3791992239dce12d0038f1f54a8adb7b02d59ab
  verify: local_dir_metadata
  loader: causal
lora:
  # r/alpha/dropout as the r4 students. Every decoder-layer linear layer
  # (attention, MLP); not lm_head.
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: '^model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)$'
  bias: none
dataset:
  # powercoder/datasets/trajectories.py over the training split: 238 graded
  # trajectories plus 119 failure-mode recovery variants (FM-7, FM-18, FM-1/9).
  trajectories: training/unsloth/out/trajectories-20261022-v2/trajectories.jsonl
training:
  # The longest rendered trajectory is 7,001 tokens (Qwen) / 6,501 (Granite).
  seq_len: 8192
  # 1e-4 is a common LoRA rate, chosen, not tuned (r4's 2e-5 x 100 steps saw 400
  # short rows). One epoch: the first r6 Qwen run's training loss was 0.0016 by
  # step 20 of 60 (epoch 0.67), so a second epoch repeated memorised targets.
  epochs: 1
  # 8 conversations per optimizer step: 357 trajectories (2,207 supervised turns;
  # injected mistakes are context only), one epoch -> 46 steps
  # for both students.
  conversations_per_step: 8
  warmup_fraction: 0.05
  learning_rate: 1.0e-4
  logging_steps: 5
  save_steps: 1000
  optim: adamw_8bit
  weight_decay: 0.01
  lr_scheduler_type: cosine
  seed: 42
  gradient_checkpointing: true
output:
  dir: training/unsloth/out/agent-sft-granite42-8b-20261022-v2
  adapter_name: granite42-8b-agent-lora
