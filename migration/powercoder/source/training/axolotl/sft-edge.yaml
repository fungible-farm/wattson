# M07 independent reproduction of the pinned edge student; no parent adapter.
base_model: Qwen/Qwen2.5-Coder-1.5B
revision_of_model: df3ce67c0e24480f20468b6ef2894622d69eb73b
strict: false
chat_template: tokenizer_default
datasets:
- path: training/axolotl/out/data-edge/tokenized-train.jsonl
  ds_type: json
  type: null
test_datasets:
- path: training/axolotl/out/data-edge/tokenized-validation.jsonl
  ds_type: json
  type: null
val_set_size: 0.0
output_dir: training/axolotl/out/reproduction-edge
dataset_prepared_path: training/axolotl/out/prepared-identical-edge
sequence_len: 1024
sample_packing: false
attn_implementation: sdpa
load_in_4bit: false
load_in_8bit: false
adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_linear: true
lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false
train_on_inputs: false
micro_batch_size: 2
gradient_accumulation_steps: 2
max_steps: 100
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 2.0e-05
warmup_steps: 10
weight_decay: 0.01
seed: 42
bf16: true
tf32: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
logging_steps: 10
save_steps: 50
eval_steps: 50
save_total_limit: 3
save_safetensors: true
save_only_model: false
wandb_project: null
resume_from_checkpoint: null
auto_resume_from_checkpoints: false
lora_model_dir: null
